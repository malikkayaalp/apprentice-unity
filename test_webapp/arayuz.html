<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Toplama Uygulaması</title>
</head>
<body>
    <h1>İki Sayıyı Topla</h1>
    <div>
        <label>Sayı 1: <input type="number" id="a" step="any"></label><br><br>
        <label>Sayı 2: <input type="number" id="b" step="any"></label><br><br>
        <button id="topla">Topla</button>
    </div>
    <div id="sonuc"></div>

    <script>
        document.getElementById("topla").addEventListener("click", function() {
            const a = document.getElementById("a").value;
            const b = document.getElementById("b").value;
            const sonucAlani = document.getElementById("sonuc");

            if (a === "" || b === "") {
                sonucAlani.textContent = "Lütfen her iki sayıyı da girin.";
                return;
            }

            const url = "/api/topla?a=" + encodeURIComponent(a) + "&b=" + encodeURIComponent(b);

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.hata) {
                        sonucAlani.textContent = "Hata: " + data.hata;
                    } else {
                        sonucAlani.textContent = "Sonuç: " + data.sonuc;
                    }
                })
                .catch(error => {
                    sonucAlani.textContent = "İstek başarısız: " + error;
                });
        });
    </script>
</body>
</html>
