<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apprentice — Canlı Panel</title>
<style>
:root{
  --bg:#0c0a08; --panel:rgba(30,26,22,.88); --panel2:rgba(48,42,36,.85);
  --cizgi:rgba(217,119,87,.20); --cizgi2:rgba(255,255,255,.08);
  --metin:#f1ede6; --soluk:#9d968b; --vurgu:#d97757; --vurgu2:#ffb38a;
  --cyan:#6ee7ff; --yesil:#7fbf6f; --sari:#e0b345; --kirmizi:#e06c5f; --mavi:#7fb4d9;
  --kod:#c8d8b0; --mor:#c9a0e8; --mono:"Cascadia Code","Consolas",monospace; --f:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(1200px 600px at 75% -10%, rgba(217,119,87,.13), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(110,231,255,.06), transparent 55%),
    var(--bg);
  color:var(--metin); font:14px/1.45 "Segoe UI",system-ui,sans-serif;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:44px 44px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(217,119,87,.25);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(217,119,87,.45)}
::-webkit-scrollbar-track{background:transparent}

#ust{display:flex;align-items:center;gap:14px;padding:9px 16px;height:48px;
  border-bottom:1px solid var(--cizgi);backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(20,17,14,.92),rgba(20,17,14,.7))}
#logo{font:800 18px "Segoe UI";letter-spacing:.5px;white-space:nowrap;
  background:linear-gradient(90deg,var(--vurgu),var(--vurgu2) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;
  border:1px solid var(--cizgi2);background:var(--panel);font-size:11.5px;color:var(--soluk);
  white-space:nowrap}
.pill b{color:var(--metin);font-weight:600}
.nokta{width:8px;height:8px;border-radius:50%;background:var(--yesil);
  box-shadow:0 0 8px var(--yesil);animation:nefes 2.2s infinite}
.nokta.kapali{background:var(--kirmizi);box-shadow:0 0 8px var(--kirmizi);animation:none}
@keyframes nefes{0%,100%{opacity:1}50%{opacity:.35}}
.olcekbar{width:90px;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.olcekbar i{display:block;height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,var(--cyan),var(--vurgu));transition:width .8s ease}
#ust .bosluk{flex:1}
#fontKontrol{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--soluk)}
#fontKontrol input{width:90px;accent-color:var(--vurgu)}
#yerlesimSifirla{padding:4px 10px;border-radius:8px;border:1px solid var(--cizgi2);
  background:transparent;color:var(--soluk);cursor:pointer;font-size:11px}
#yerlesimSifirla:hover{color:var(--metin);border-color:var(--cizgi)}

#alan{position:relative;height:calc(100% - 48px);font-size:calc(13px*var(--f));
  overflow-y:auto;overflow-x:hidden}
.kart{position:absolute;display:flex;flex-direction:column;
  border:1px solid var(--cizgi2);border-radius:13px;background:var(--panel);
  backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden;
  transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}
.kart.tasiniyor{transition:none;opacity:.92;box-shadow:0 18px 50px rgba(0,0,0,.65);
  border-color:var(--vurgu)}
.kart.onde{border-color:var(--cizgi);box-shadow:0 14px 44px rgba(0,0,0,.55)}
.kbaslik{padding:7px 12px;font:700 .78em var(--mono);letter-spacing:1.4px;color:var(--soluk);
  border-bottom:1px solid var(--cizgi2);display:flex;align-items:center;gap:8px;
  cursor:grab;user-select:none;flex-shrink:0}
.kbaslik:active{cursor:grabbing}
.kbaslik::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--vurgu);
  box-shadow:0 0 6px var(--vurgu);flex-shrink:0}
.kbaslik .kek{margin-left:auto;color:var(--vurgu2);font-weight:400;letter-spacing:0}
.kgovde{flex:1;min-height:0;display:flex;flex-direction:column}
.tutamak{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;
  border-right:2px solid rgba(217,119,87,.5);border-bottom:2px solid rgba(217,119,87,.5);
  border-radius:0 0 6px 0}

#isListe{overflow-y:auto;padding:7px}
.is{padding:8px 10px;border-radius:9px;margin-bottom:5px;cursor:pointer;
  border:1px solid transparent;transition:all .15s}
.is:hover{background:var(--panel2);border-color:var(--cizgi)}
.is.aktif{background:linear-gradient(90deg,rgba(217,119,87,.16),rgba(217,119,87,.05));
  border-color:rgba(217,119,87,.5)}
.is .ibaslik{font-size:.92em;font-weight:600;color:var(--metin);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.is .iid{font:.68em var(--mono);color:var(--soluk)}
.is .imeta{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.rozet{padding:1px 7px;border-radius:6px;font-size:.68em;border:1px solid var(--cizgi2);color:var(--soluk)}
.rozet.ok{color:var(--yesil);border-color:rgba(127,191,111,.4)}
.rozet.hata{color:var(--kirmizi);border-color:rgba(224,108,95,.4)}
.rozet.kosuyor{color:var(--sari);border-color:rgba(224,179,69,.4);animation:nefes 1.6s infinite}
.rozet.web{color:var(--cyan);border-color:rgba(110,231,255,.35)}

#boruSvgKap{flex:1;display:flex;align-items:center}
#boruSvgKap svg{width:100%;height:100%;max-height:110px}
.dugum circle{fill:var(--panel2);stroke:var(--cizgi2);stroke-width:1.5;transition:all .3s}
.dugum text{fill:var(--soluk);font:600 9.5px var(--mono);letter-spacing:.5px;text-anchor:middle}
.dugum .sayi{fill:var(--metin);font:700 12px var(--mono)}
.dugum.aktif circle{stroke:var(--vurgu);stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(217,119,87,.8))}
.dugum.aktif text{fill:var(--vurgu2)}
.dugum.filtreli circle{fill:rgba(217,119,87,.25)}
.hat{stroke:var(--cizgi2);stroke-width:2;stroke-dasharray:6 5}
.hat.akiyor{stroke:var(--vurgu);animation:akis 1s linear infinite;
  filter:drop-shadow(0 0 4px rgba(217,119,87,.6))}
@keyframes akis{to{stroke-dashoffset:-11}}
.dugum{cursor:pointer}

#akis{flex:1;overflow-y:auto;overflow-x:hidden;padding:9px 11px;scroll-behavior:smooth;min-width:0}
.olay{display:flex;gap:9px;padding:6px 9px;margin-bottom:5px;border-radius:9px;min-width:0;
  border:1px solid transparent;border-left:3px solid var(--cizgi2);
  background:rgba(255,255,255,.018);animation:gel .3s ease;font-size:.92em}
@keyframes gel{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.olay:hover{border-color:var(--cizgi)}
.olay .ikon{font-family:var(--mono);width:18px;text-align:center;flex-shrink:0;padding-top:1px}
.olay .icerik{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;
  font-family:var(--mono);font-size:.88em}
.olay.arac{border-left-color:var(--sari)} .olay.arac .ikon{color:var(--sari)}
.olay.yazim{border-left-color:var(--yesil)} .olay.yazim .ikon{color:var(--yesil)}
.olay.hata{border-left-color:var(--kirmizi);background:rgba(224,108,95,.06)} .olay.hata .ikon{color:var(--kirmizi)}
.olay.sonuc{border-left-color:var(--mavi)} .olay.sonuc .ikon{color:var(--mavi)}
.olay.bilgi{border-left-color:var(--cizgi2);color:var(--soluk)}
.olay.kanit{border-left-color:var(--cyan);background:rgba(110,231,255,.05)} .olay.kanit .ikon{color:var(--cyan)}
.olay .zaman{font-size:.68em;color:var(--soluk);font-family:var(--mono);flex-shrink:0;padding-top:2px}
details.ham{margin-top:5px;min-width:0}
details.ham summary{cursor:pointer;color:var(--soluk);font-size:.78em;user-select:none}
details.ham pre{margin-top:5px;padding:8px;border-radius:8px;background:rgba(0,0,0,.35);
  font-size:.8em;color:var(--mor);white-space:pre-wrap;overflow-wrap:anywhere;
  max-height:240px;overflow-y:auto}
.kodblok{margin:6px 0 2px;border:1px solid var(--cizgi2);border-radius:10px;overflow:hidden;
  background:rgba(12,10,8,.75);min-width:0}
.kodblok .kbas{display:flex;justify-content:space-between;padding:5px 10px;font:600 .8em var(--mono);
  color:var(--vurgu2);background:rgba(217,119,87,.09);border-bottom:1px solid var(--cizgi2)}
.kodblok pre{padding:7px 0;overflow-x:auto;font:.86em/1.5 var(--mono)}
.satir{display:flex}
.satir .no{width:38px;text-align:right;padding-right:10px;color:rgba(157,150,139,.45);
  user-select:none;flex-shrink:0;font-size:.78em;padding-top:1px}
.satir .sk{white-space:pre;flex:1;padding-right:12px}
.tk-kw{color:var(--mavi)} .tk-str{color:var(--sari)} .tk-yorum{color:#8a9a7a;font-style:italic}
.tk-sayi{color:var(--mor)} .tk-fn{color:var(--vurgu2)}

#dmetin{flex:1;overflow-y:auto;padding:10px 13px;font:.95em/1.55 var(--mono);color:var(--kod);
  white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(10,9,7,.5)}
#dmetin .bekliyor{color:var(--soluk);font-style:italic}
.imlec{display:inline-block;width:8px;height:1em;background:var(--vurgu);
  vertical-align:text-bottom;animation:nefes .9s infinite;margin-left:1px;border-radius:1px}

.metrikler{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:7px;
  padding:9px;overflow-y:auto}
.metrik{padding:8px 5px;border-radius:10px;background:rgba(0,0,0,.25);text-align:center;
  border:1px solid var(--cizgi2)}
.metrik b{display:block;font:700 1.25em var(--mono);
  background:linear-gradient(180deg,var(--metin),var(--vurgu2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.metrik span{font-size:.62em;color:var(--soluk);letter-spacing:.5px}

#ozetKutu{padding:9px 12px;font:.85em var(--mono);color:var(--soluk);line-height:1.7;
  overflow-y:auto;overflow-wrap:anywhere}
#ozetKutu b{color:var(--metin)}
.uyari{padding:6px 10px;margin-top:6px;border-radius:8px;font:.82em var(--mono);
  background:rgba(224,179,69,.08);border:1px solid rgba(224,179,69,.3);color:var(--sari);
  overflow-wrap:anywhere}
.uyari.sert{background:rgba(224,108,95,.1);border-color:rgba(224,108,95,.45);color:var(--kirmizi)}

#dosyaSekmeler{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px 0;flex-shrink:0}
.sekme{padding:3px 10px;border-radius:7px;font:600 .78em var(--mono);cursor:pointer;
  border:1px solid var(--cizgi2);color:var(--soluk);transition:all .15s}
.sekme:hover{color:var(--metin)}
.sekme.aktif{color:var(--vurgu2);border-color:rgba(217,119,87,.5);background:rgba(217,119,87,.1)}
#dosyaGoster{flex:1;overflow:auto;margin:8px;border-radius:10px;background:rgba(12,10,8,.7);min-height:60px}

.gform{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:11px 13px}
.gform textarea,.gform input,.gform select{width:100%;padding:7px 10px;border-radius:9px;
  border:1px solid var(--cizgi2);background:rgba(0,0,0,.35);color:var(--metin);
  font:.88em var(--mono);outline:none;resize:vertical}
.gform textarea:focus,.gform input:focus{border-color:rgba(217,119,87,.55)}
.gform label{font-size:.72em;color:var(--soluk);letter-spacing:.4px}
.ksatir{display:flex;gap:8px}.ksatir>div{flex:1}
.kapat{margin-left:6px;color:var(--soluk);cursor:pointer;font-size:1.05em;line-height:1;
  padding:0 3px;border-radius:5px;flex-shrink:0}
.kapat:hover{color:var(--kirmizi);background:rgba(224,108,95,.12)}
#panelEkle{padding:4px 8px;border-radius:8px;border:1px solid var(--cizgi2);
  background:var(--panel);color:var(--soluk);font-size:11px;outline:none;max-width:130px}
#filtreEtiket{cursor:pointer}
#filtreEtiket:hover{text-decoration:underline}
.is{position:relative}
.is .sil{position:absolute;right:6px;top:6px;color:var(--soluk);cursor:pointer;
  font-size:.8em;padding:1px 5px;border-radius:5px;opacity:0;transition:opacity .15s}
.is:hover .sil{opacity:1}
.is .sil:hover{color:var(--kirmizi);background:rgba(224,108,95,.15)}
.kutucuk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soluk);cursor:pointer}
#gonder{padding:10px;border:none;border-radius:10px;cursor:pointer;font:700 13px "Segoe UI";
  color:#fff;background:linear-gradient(135deg,var(--vurgu),#c96a48)}
#gonder:disabled{opacity:.5;cursor:wait}
#kNot{font-size:10.5px;color:var(--soluk)}
#tost{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  padding:10px 22px;border-radius:999px;background:rgba(24,20,17,.95);
  border:1px solid rgba(127,191,111,.5);color:var(--yesil);font:600 12.5px var(--mono);
  display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="ust">
  <div id="logo">APPRENTICE</div>
  <div class="pill"><span class="nokta" id="modelNokta"></span><span id="modelAd">—</span></div>
  <div class="pill">VRAM <b id="vramT">—</b><div class="olcekbar"><i id="vramBar"></i></div></div>
  <div class="pill">GPU <b id="gpuT">—</b><div class="olcekbar"><i id="gpuBar"></i></div></div>
  <div class="bosluk"></div>
  <div id="fontKontrol">yazı <input type="range" id="fontOlcek" min="0.75" max="1.5" step="0.05" value="1"></div>
  <select id="panelEkle"><option value="">➕ panel ekle</option></select>
  <button id="yerlesimSifirla">yerleşimi sıfırla</button>
</div>

<div id="alan">
  <div class="kart" data-p="isler"><div class="kbaslik">İŞLER</div>
    <div class="kgovde"><div id="isListe"></div></div><div class="tutamak"></div></div>

  <div class="kart" data-p="boru"><div class="kbaslik">BORU HATTI <span class="kek" id="filtreEtiket"></span></div>
    <div class="kgovde"><div id="boruSvgKap"><svg viewBox="0 0 760 92" id="boruSvg"></svg></div></div>
    <div class="tutamak"></div></div>

  <div class="kart" data-p="akis"><div class="kbaslik">CANLI OLAY AKIŞI</div>
    <div class="kgovde"><div id="akis"></div></div><div class="tutamak"></div></div>

  <div class="kart" data-p="daktilo"><div class="kbaslik" style="color:var(--sari)">MODEL ŞU AN YAZIYOR
      <span class="kek" id="daktiloDurum"></span></div>
    <div class="kgovde"><div id="dmetin"><span class="bekliyor">canlı kipte iş başlayınca token akışı burada…</span></div></div>
    <div class="tutamak"></div></div>

  <div class="kart" data-p="metrik"><div class="kbaslik">METRİKLER</div>
    <div class="kgovde"><div class="metrikler">
      <div class="metrik"><b id="mIlk">—</b><span>İLK BAĞLAM</span></div>
      <div class="metrik"><b id="mPrompt">0</b><span>PROMPT TOK</span></div>
      <div class="metrik"><b id="mUretim">0</b><span>ÜRETİM TOK</span></div>
      <div class="metrik"><b id="mSure">0s</b><span>SÜRE</span></div>
      <div class="metrik"><b id="mArac">0</b><span>ARAÇ</span></div>
      <div class="metrik"><b id="mYazim">0</b><span>YAZIM</span></div>
      <div class="metrik"><b id="mOnarim">0</b><span>ONARIM</span></div>
      <div class="metrik"><b id="mCagri">0</b><span>ÇAĞRI</span></div>
    </div></div><div class="tutamak"></div></div>

  <div class="kart" data-p="ozet"><div class="kbaslik">İŞ ÖZETİ</div>
    <div class="kgovde"><div id="ozetKutu">—</div><div id="uyarilar" style="padding:0 12px 10px"></div></div>
    <div class="tutamak"></div></div>

  <div class="kart" data-p="dosyalar"><div class="kbaslik">YAZILAN DOSYALAR</div>
    <div class="kgovde"><div id="dosyaSekmeler"></div><div id="dosyaGoster"></div></div>
    <div class="tutamak"></div></div>

  <div class="kart" data-p="gorev"><div class="kbaslik" style="color:var(--vurgu2)">⚡ GÖREV GÖNDER
      <span class="kek">usta sonraki aracında bildirilir</span></div>
    <div class="kgovde"><div class="gform">
      <label>BAŞLIK (listede görünür)</label>
      <input id="kBaslik" placeholder="kalman filtresi">
      <label>GÖREV</label>
      <textarea id="kGorev" rows="3" placeholder="kalman.py dosyasina 1D Kalman filtresi sinifi yaz..."></textarea>
      <label>KABUL KRİTERLERİ (her satır bir kriter)</label>
      <textarea id="kKriter" rows="2"></textarea>
      <div class="ksatir">
        <div><label>ÇALIŞMA DİZİNİ</label><input id="kDizin" placeholder="deneme"></div>
        <div><label>YAZILABİLİR (virgülle)</label><input id="kYaz" placeholder="kalman.py"></div>
      </div>
      <div class="ksatir">
        <div><label>DOĞRULAMA</label><select id="kDog"><option value="derleme">derleme (hızlı)</option><option value="tam">tam (testler koşar)</option></select></div>
        <div style="display:flex;align-items:flex-end;gap:12px;padding-bottom:4px">
          <label class="kutucuk"><input type="checkbox" id="kCanli" checked> canlı</label>
          <label class="kutucuk"><input type="checkbox" id="kHarita"> harita</label>
        </div>
      </div>
      <button id="gonder">ÇIRAĞI ÇALIŞTIR</button>
      <div id="kNot"></div>
    </div></div>
    <div class="tutamak"></div></div>
</div>
<div id="tost"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const ASAMALAR=[["tumu","TÜMÜ"],["baslama","BAŞLANGIÇ"],["uretim","ÜRETİM"],
                ["dogrulama","DOĞRULAMA"],["onarim","ONARIM"],["usta","USTA RAPORU"]];
const IKON={arac:"⚙",yazim:"▣",hata:"✖",sonuc:"◈",bilgi:"·",kanit:"✓"};
let seciliIs=null, imlecN=0, filtre="tumu", takip=true, olaylar=[], t0=null;
let daktiloHedef="", daktiloCiz=0, dosyalar={}, seciliDosya=null, dosyaElle=false;
let girisKartlariEklendi=false, sonOzet={};

/* --------------- akilli izgara yerlesimi (gridstack-mini) ---------------
   24 sutunluk gorunmez izgara: tasima/boyutlandirma hucreye SNAP eder; cakisan panel
   ASAGI itilir (ust uste binmek imkansiz); birakinca herkes YUKARI sikisir (bosluk kalmaz).
   Digerleri CSS gecissiyle yumusak kayar - "sezgisel" his buradan gelir. */
const SUTUN=24, SATIR=24;
const VARSAYILAN={
  isler:{gx:0,gy:0,gw:5,gh:24}, boru:{gx:5,gy:0,gw:12,gh:4},
  akis:{gx:5,gy:4,gw:12,gh:12}, daktilo:{gx:5,gy:16,gw:12,gh:8},
  metrik:{gx:17,gy:0,gw:7,gh:5}, ozet:{gx:17,gy:5,gw:7,gh:6},
  gorev:{gx:17,gy:11,gw:7,gh:8}, dosyalar:{gx:17,gy:19,gw:7,gh:5}};
const PANEL_ADLARI={isler:"İŞLER",boru:"BORU HATTI",akis:"OLAY AKIŞI",daktilo:"DAKTİLO",
  metrik:"METRİKLER",ozet:"İŞ ÖZETİ",gorev:"GÖREV GÖNDER",dosyalar:"DOSYALAR"};
let gizliPaneller=new Set();
try{gizliPaneller=new Set(JSON.parse(localStorage.getItem("apprentice_gizli_paneller"))||[])}catch(e){}
let gizliIsler=new Set();
try{gizliIsler=new Set(JSON.parse(localStorage.getItem("apprentice_gizli_isler"))||[])}catch(e){}
let yerlesim=null;
try{yerlesim=JSON.parse(localStorage.getItem("apprentice_yerlesim_v3"))||null}catch(e){}
if(!yerlesim||!yerlesim.isler||yerlesim.isler.gx===undefined)
  yerlesim=JSON.parse(JSON.stringify(VARSAYILAN));
let ustZ=10, surukluAd=null;

function hucre(){const A=$("#alan").getBoundingClientRect();
  return {w:A.width/SUTUN,h:Math.max(30,A.height/SATIR),ax:A.left,ay:A.top}}
function cakisir(a,b){return !(a.gx+a.gw<=b.gx||b.gx+b.gw<=a.gx||a.gy+a.gh<=b.gy||b.gy+b.gh<=a.gy)}

function aktifAdlar(){return Object.keys(yerlesim).filter(a=>!gizliPaneller.has(a))}
function itele(){
  // suruklenen sabit kalir; onunla (ve birbirleriyle) cakisanlar asagi itilir
  const adlar=aktifAdlar().sort((a,b)=>yerlesim[a].gy-yerlesim[b].gy);
  let koruma=0, degisti=true;
  while(degisti&&koruma++<300){degisti=false;
    for(const a of adlar)for(const b of adlar){
      if(a===b)continue;
      const p=yerlesim[a],q=yerlesim[b];
      if(!cakisir(p,q))continue;
      const itilen=(b===surukluAd)?a:b;          // surukleneni ASLA itme
      const sabit=(itilen===a)?b:a;
      yerlesim[itilen].gy=yerlesim[sabit].gy+yerlesim[sabit].gh;
      degisti=true;
    }
  }
}
function sikistir(){
  // yukari sikistirma: bosluk birakma (suruklenen haric - kullanicinin eli nerede o orada)
  const adlar=aktifAdlar().filter(a=>a!==surukluAd)
    .sort((a,b)=>yerlesim[a].gy-yerlesim[b].gy);
  for(const a of adlar){
    const p=yerlesim[a];
    while(p.gy>0){
      p.gy--;
      const carpti=aktifAdlar().some(b=>b!==a&&cakisir(p,yerlesim[b]));
      if(carpti){p.gy++;break}
    }
  }
}
function uygula(){
  const h=hucre();
  document.querySelectorAll(".kart").forEach(k=>{
    const ad=k.dataset.p, p=yerlesim[ad]; if(!p)return;
    k.style.display=gizliPaneller.has(ad)?"none":"flex";
    k.style.left=(p.gx*h.w+3)+"px"; k.style.top=(p.gy*h.h+3)+"px";
    k.style.width=(p.gw*h.w-6)+"px"; k.style.height=(p.gh*h.h-6)+"px";
  });
  const sec=$("#panelEkle");
  sec.innerHTML='<option value="">➕ panel ekle</option>'+
    [...gizliPaneller].map(a=>'<option value="'+a+'">'+(PANEL_ADLARI[a]||a)+'</option>').join("");
  sec.style.display=gizliPaneller.size?"":"none";
}
function panelKaydet(){localStorage.setItem("apprentice_gizli_paneller",JSON.stringify([...gizliPaneller]))}
$("#panelEkle").onchange=e=>{if(e.target.value){gizliPaneller.delete(e.target.value);
  panelKaydet();duzenle()}e.target.value=""};
function duzenle(){itele();sikistir();itele();uygula()}
function kaydet(){localStorage.setItem("apprentice_yerlesim_v3",JSON.stringify(yerlesim))}
window.addEventListener("resize",uygula);
$("#yerlesimSifirla").onclick=()=>{yerlesim=JSON.parse(JSON.stringify(VARSAYILAN));kaydet();uygula()};

document.querySelectorAll(".kart").forEach(k=>{
  const ad=k.dataset.p;
  // kapatma dugmesi: panel gizlenir, ust bardaki "panel ekle" ile geri gelir
  const kx=document.createElement("span"); kx.className="kapat"; kx.textContent="✕";
  kx.title="paneli kapat"; kx.addEventListener("pointerdown",e=>e.stopPropagation());
  kx.onclick=e=>{e.stopPropagation();gizliPaneller.add(ad);panelKaydet();duzenle()};
  k.querySelector(".kbaslik").appendChild(kx);
  k.addEventListener("pointerdown",()=>{k.style.zIndex=++ustZ;
    document.querySelectorAll(".kart").forEach(x=>x.classList.remove("onde"));k.classList.add("onde")});
  const bas=k.querySelector(".kbaslik");
  bas.addEventListener("pointerdown",e=>{
    if(e.target.closest(".kek"))return;
    const p=yerlesim[ad], h=hucre();
    const sx=e.clientX,sy=e.clientY,ox=p.gx,oy=p.gy;
    surukluAd=ad; k.classList.add("tasiniyor");
    function tasi(ev){
      const ngx=Math.max(0,Math.min(SUTUN-p.gw,ox+Math.round((ev.clientX-sx)/h.w)));
      const ngy=Math.max(0,oy+Math.round((ev.clientY-sy)/h.h));
      if(ngx!==p.gx||ngy!==p.gy){p.gx=ngx;p.gy=ngy;duzenle()}
    }
    function birak(){removeEventListener("pointermove",tasi);removeEventListener("pointerup",birak);
      k.classList.remove("tasiniyor");surukluAd=null;duzenle();kaydet()}
    addEventListener("pointermove",tasi);addEventListener("pointerup",birak);e.preventDefault();
  });
  const tut=k.querySelector(".tutamak");
  if(tut)tut.addEventListener("pointerdown",e=>{
    const p=yerlesim[ad], h=hucre();
    const sx=e.clientX,sy=e.clientY,ow=p.gw,oh=p.gh;
    surukluAd=ad; k.classList.add("tasiniyor");
    function boyut(ev){
      const ngw=Math.max(3,Math.min(SUTUN-p.gx,ow+Math.round((ev.clientX-sx)/h.w)));
      const ngh=Math.max(2,oh+Math.round((ev.clientY-sy)/h.h));
      if(ngw!==p.gw||ngh!==p.gh){p.gw=ngw;p.gh=ngh;duzenle()}
    }
    function birak(){removeEventListener("pointermove",boyut);removeEventListener("pointerup",birak);
      k.classList.remove("tasiniyor");surukluAd=null;duzenle();kaydet()}
    addEventListener("pointermove",boyut);addEventListener("pointerup",birak);
    e.preventDefault();e.stopPropagation();
  });
});
$("#fontOlcek").value=localStorage.getItem("apprentice_font")||"1";
document.documentElement.style.setProperty("--f",$("#fontOlcek").value);
$("#fontOlcek").oninput=e=>{document.documentElement.style.setProperty("--f",e.target.value);
  localStorage.setItem("apprentice_font",e.target.value)};

/* --------------- sozdizimi renklendirme --------------- */
const KW=/\b(def|class|if|elif|else|for|while|return|import|from|raise|try|except|finally|with|as|in|not|and|or|is|None|True|False|lambda|pass|break|continue|yield|self|public|private|protected|static|void|var|new|using|namespace|int|float|string|bool|foreach|null|this|override|virtual|async|await|const|let|function)\b/g;
function kacir(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function renklendir(satir){
  let s=kacir(satir);
  s=s.replace(/(#[^\n]*|\/\/[^\n]*)/g,'␁yorum␂$1␃');
  s=s.replace(/(&quot;[^&]*?&quot;|'[^'\n]*')/g,'␁str␂$1␃');
  s=s.replace(KW,'␁kw␂$&␃');
  s=s.replace(/\b(\d[\d_.]*)\b/g,'␁sayi␂$1␃');
  return s.replace(/␁(\w+)␂/g,'<span class="tk-$1">').replace(/␃/g,'</span>');
}
function kodBlok(yol,icerik,sinir){
  const satirlar=icerik.split("\n"); const n=satirlar.length;
  const kes=sinir&&n>sinir?satirlar.slice(0,sinir):satirlar;
  let h='<div class="kodblok"><div class="kbas"><span>'+kacir(yol||"")+'</span><span>'+n+' satır</span></div><pre>';
  kes.forEach((s,i)=>{h+='<div class="satir"><span class="no">'+(i+1)+'</span><span class="sk">'+renklendir(s)+'</span></div>';});
  if(sinir&&n>sinir)h+='<div class="satir"><span class="no">…</span><span class="sk" style="color:var(--soluk)">+'+(n-sinir)+' satır — DOSYALAR panelinde tamamı</span></div>';
  return h+'</pre></div>';
}

/* --------------- boru hatti --------------- */
function boruCiz(){
  const svg=$("#boruSvg"); const g=ASAMALAR.filter(a=>a[0]!=="tumu");
  const aralik=760/(g.length+0.4); let h="";
  g.forEach((a,i)=>{
    const x=aralik*(i+0.7);
    if(i>0)h+='<line class="hat" id="hat-'+a[0]+'" x1="'+(x-aralik+26)+'" y1="34" x2="'+(x-26)+'" y2="34"/>';
    h+='<g class="dugum" id="dugum-'+a[0]+'" onclick="filtreSec(\''+a[0]+'\')">'+
       '<circle cx="'+x+'" cy="34" r="22"/><text x="'+x+'" y="38" class="sayi" id="sayi-'+a[0]+'"></text>'+
       '<text x="'+x+'" y="76">'+a[1]+'</text></g>';
  });
  h+='<g class="dugum" id="dugum-tumu" onclick="filtreSec(\'tumu\')">'+
     '<circle cx="26" cy="34" r="14"/><text x="26" y="70">TÜMÜ</text></g>';
  svg.innerHTML=h;
}
function filtreSec(a){
  if(a===filtre&&a!=="tumu")a="tumu";               // ayni asamaya ikinci tik = filtreyi kaldir
  filtre=a; $("#akis").innerHTML=""; girisKartlariEklendi=false; girisKartlari();
  olaylar.forEach(ekleOlay);
  const ADLAR={baslama:"BAŞLANGIÇ",uretim:"ÜRETİM",dogrulama:"DOĞRULAMA",onarim:"ONARIM",usta:"USTA"};
  $("#filtreEtiket").textContent=a==="tumu"?"":
    "yalnızca "+ADLAR[a]+" olayları gösteriliyor — tümüne dön ✕";
  $("#filtreEtiket").onclick=()=>filtreSec("tumu");
  document.querySelectorAll(".dugum").forEach(d=>d.classList.remove("filtreli"));
  const d=$("#dugum-"+a); if(d&&a!=="tumu")d.classList.add("filtreli");
}
window.filtreSec=filtreSec;

/* --------------- olay akisi --------------- */
function girisKartlari(){
  if(filtre!=="tumu"&&filtre!=="baslama"){const e=$("#girisKap");if(e)e.remove();return;}
  const kap=$("#akis"); let h="";
  if(sonOzet.gorev)h+='<div class="olay sonuc"><span class="ikon">◈</span><div class="icerik">GÖREV (ustadan): '+
    kacir(sonOzet.gorev.slice(0,400))+'</div></div>';
  if(sonOzet.prompt)h+='<div class="olay bilgi"><span class="ikon">·</span><div class="icerik">'+
    '<details class="ham"><summary>işçiye giden TAM PROMPT (görev + kriterler + kurallar)</summary><pre>'+
    kacir(sonOzet.prompt)+'</pre></details></div></div>';
  if(sonOzet.sistem_metin)h+='<div class="olay bilgi"><span class="ikon">·</span><div class="icerik">'+
    '<details class="ham"><summary>işçinin SİSTEM MESAJI (karakter: '+(sonOzet.baglam&&sonOzet.baglam.sistem||"?")+')</summary><pre>'+
    kacir(sonOzet.sistem_metin)+'</pre></details></div></div>';
  let gk=$("#girisKap");
  if(!gk){gk=document.createElement("div");gk.id="girisKap";kap.insertAdjacentElement("afterbegin",gk);}
  if(gk.innerHTML!==h)gk.innerHTML=h;      // mukerrer degil: sabit kapsayici GUNCELLENIR
}
function ekleOlay(o){
  if(filtre!=="tumu"&&o.asama!==filtre)return;
  if(o.tip==="baglam"&&o.ham&&o.ham.sistem_metin){sonOzet.sistem_metin=o.ham.sistem_metin;girisKartlariEklendi=false;girisKartlari();}
  const kap=$("#akis"); const div=document.createElement("div");
  const sinif=o.metin&&o.metin.startsWith("KANIT")?"kanit":o.etiket;
  div.className="olay "+sinif;
  let ic='<span class="ikon">'+(IKON[sinif]||"·")+'</span><div class="icerik">'+kacir(o.metin||"");
  if(o.kod)ic+=kodBlok(o.yol,o.kod,50);
  if(o.ham&&["tool","tool_result","result","usta_rapor","baglam"].includes(o.tip)){
    const ham={...o.ham}; delete ham.sistem_metin;
    ic+='<details class="ham"><summary>ham veri</summary><pre>'+kacir(JSON.stringify(ham,null,1).slice(0,2500))+'</pre></details>';
  }
  ic+='</div>';
  if(t0){const dt=((Date.now()-t0)/1000)|0;ic+='<span class="zaman">+'+dt+'s</span>';}
  div.innerHTML=ic; kap.appendChild(div);
  while(kap.children.length>500)kap.removeChild(kap.firstChild);
  if(takip)kap.scrollTop=kap.scrollHeight;
}

/* --------------- daktilo --------------- */
function daktiloAdim(){
  if(daktiloCiz<daktiloHedef.length){
    const geri=daktiloHedef.length-daktiloCiz;
    const adim=geri>1500?110:(geri>350?28:9);
    daktiloCiz=Math.min(daktiloHedef.length,daktiloCiz+adim);
    const m=$("#dmetin");
    m.innerHTML=renklendir2(daktiloHedef.slice(0,daktiloCiz).slice(-9000))+'<span class="imlec"></span>';
    m.scrollTop=m.scrollHeight;
  }
  setTimeout(daktiloAdim,42);
}
function renklendir2(metin){return metin.split("\n").map(renklendir).join("\n")}

/* --------------- dosyalar --------------- */
function dosyalarCiz(){
  const kap=$("#dosyaSekmeler"); kap.innerHTML="";
  const adlar=Object.keys(dosyalar);
  adlar.forEach(ad=>{
    const s=document.createElement("span");
    s.className="sekme"+(ad===seciliDosya?" aktif":"");
    s.textContent=ad; s.onclick=()=>{seciliDosya=ad;dosyaElle=true;dosyalarCiz();};
    kap.appendChild(s);
  });
  if(!dosyaElle&&adlar.length)seciliDosya=adlar[adlar.length-1];
  $("#dosyaGoster").innerHTML=seciliDosya?kodBlok(seciliDosya,dosyalar[seciliDosya]||""):"";
}

/* --------------- is secimi + dongu --------------- */
function isSec(id){
  if(seciliIs===id)return;
  seciliIs=id; imlecN=0; olaylar=[]; dosyalar={}; seciliDosya=null; dosyaElle=false;
  daktiloHedef=""; daktiloCiz=0; t0=null; girisKartlariEklendi=false; sonOzet={};
  $("#akis").innerHTML=""; $("#dmetin").innerHTML='<span class="bekliyor">bekleniyor…</span>';
}
async function isleriCek(){
  try{
    const r=await(await fetch("/api/isler")).json();
    const sis=r.sistem||{};
    $("#modelAd").textContent=sis.model?sis.model.slice(0,30)+" · "+sis.yuklu_gb+" GB":"model yüklü değil";
    $("#modelNokta").className="nokta"+(sis.model?"":" kapali");
    if(sis.vram&&sis.vram[1]){$("#vramT").textContent=(sis.vram[0]/1024).toFixed(1)+"/"+(sis.vram[1]/1024).toFixed(1)+"G";
      $("#vramBar").style.width=(100*sis.vram[0]/sis.vram[1])+"%";}
    $("#gpuT").textContent="%"+(sis.gpu||0); $("#gpuBar").style.width=(sis.gpu||0)+"%";
    const kap=$("#isListe"); kap.innerHTML="";
    const gorunur=(r.isler||[]).filter(j=>!gizliIsler.has(j.id));
    gorunur.slice(0,14).forEach(j=>{
      const d=document.createElement("div");
      d.className="is"+(j.id===seciliIs?" aktif":"");
      const rz=j.durum==="calisiyor"?"kosuyor":(j.derleme==="derlendi"?"ok":"hata");
      d.innerHTML='<div class="ibaslik">'+kacir(j.baslik||j.id)+'</div><div class="iid">'+j.id+'</div>'+
        '<div class="imeta"><span class="rozet">'+j.ortam+'</span><span class="rozet '+rz+'">'+
        (j.durum==="calisiyor"?"koşuyor":j.derleme)+'</span>'+
        (j.kaynak==="web-panel"?'<span class="rozet web">⚡ web</span>':"")+'</div>'+
        '<span class="sil" title="listeden kaldır (yalnız arayüzden)">✕</span>';
      d.onclick=()=>{takip=false;isSec(j.id)};
      d.querySelector(".sil").onclick=e=>{e.stopPropagation();gizliIsler.add(j.id);
        localStorage.setItem("apprentice_gizli_isler",JSON.stringify([...gizliIsler]))};
      kap.appendChild(d);
    });
    if(gizliIsler.size){
      const g=document.createElement("div");
      g.style.cssText="text-align:center;padding:5px;color:var(--soluk);font-size:.72em;cursor:pointer";
      g.textContent="gizlenen "+gizliIsler.size+" işi geri getir";
      g.onclick=()=>{gizliIsler.clear();localStorage.removeItem("apprentice_gizli_isler")};
      kap.appendChild(g);
    }
    if(takip&&gorunur.length)isSec(gorunur[0].id);
  }catch(e){}
  setTimeout(isleriCek,2000);
}
async function olaylariCek(){
  if(seciliIs){
    try{
      const r=await(await fetch("/api/olaylar?is="+seciliIs+"&n="+imlecN)).json();
      const s=r.ozet||{}; Object.assign(sonOzet,s);
      if(!t0&&s.baslangic)t0=s.baslangic*1000;
      girisKartlari();
      (r.yeni||[]).forEach(o=>{
        olaylar.push(o); ekleOlay(o);
        if(o.tip==="write"&&o.yol){dosyalar[o.yol]=o.kod||""; dosyalarCiz();}
      });
      imlecN=r.toplam||imlecN;
      if(r.canli&&r.canli.trim()){
        if(!r.canli.startsWith(daktiloHedef)){daktiloCiz=0;$("#dmetin").innerHTML="";}
        daktiloHedef=r.canli; $("#daktiloDurum").textContent="● akıyor";
      }else{
        $("#daktiloDurum").textContent=s.durum==="calisiyor"?"boşta":"";
        if(s.durum!=="calisiyor"&&!daktiloHedef)
          $("#dmetin").innerHTML='<span class="bekliyor">canlı kipte iş başlayınca token akışı burada…</span>';
      }
      const aktif=s.asama||"baslama";
      ASAMALAR.forEach(([a])=>{if(a==="tumu")return;
        const d=$("#dugum-"+a); if(!d)return;
        d.classList.toggle("aktif",a===aktif);
        const h=$("#hat-"+a); if(h)h.classList.toggle("akiyor",a===aktif&&s.durum==="calisiyor");
      });
      const sy=s.sayac||{};
      const sayilar={uretim:sy.arac||"",dogrulama:sy.kanit_hata||"",onarim:sy.onarim||"",
                     usta:s.asama==="usta"?"✓":"",baslama:""};
      Object.entries(sayilar).forEach(([a,v])=>{const t=$("#sayi-"+a);if(t)t.textContent=v;});
      const ku=s.kullanim||{};
      $("#mIlk").textContent=ku.ilk_prompt_tokens?ku.ilk_prompt_tokens.toLocaleString("tr"):"—";
      $("#mPrompt").textContent=(ku.prompt_tokens||0).toLocaleString("tr");
      $("#mUretim").textContent=(ku.gen_tokens||0).toLocaleString("tr");
      $("#mSure").textContent=(s.sure||0)+"s";
      $("#mArac").textContent=sy.arac||0; $("#mYazim").textContent=sy.yazim||0;
      $("#mOnarim").textContent=sy.onarim||0; $("#mCagri").textContent=ku.model_cagrisi||0;
      const b=s.baglam||{};
      $("#ozetKutu").innerHTML="iş: <b>"+(s.baslik||s.id||"—")+"</b><br><span style='font-size:.85em'>"+(s.id||"")+
        "</span><br>ortam: <b>"+(s.ortam||"—")+"</b> · doğrulama: <b>"+(s.dogrulama||"—")+
        "</b> · durum: <b>"+(s.durum||"—")+"</b><br>bağlam: sistem <b>"+(b.sistem||"—")+
        "</b> kr · hafıza <b>"+(b.hafiza||"—")+"</b> · STATE <b>"+(b.durum||"—")+
        "</b> · harita <b>"+(b.harita||"—")+"</b><br>görev: "+kacir((s.gorev||"").slice(0,180));
      const uy=$("#uyarilar"); uy.innerHTML="";
      (s.uyarilar||[]).slice(0,5).forEach(u=>{
        const d=document.createElement("div");
        d.className="uyari"+(String(u).startsWith("DURAGANLIK")?" sert":"");
        d.textContent=u; uy.appendChild(d);
      });
      (s.hatalar||[]).slice(0,2).forEach(u=>{
        const d=document.createElement("div"); d.className="uyari sert"; d.textContent=u; uy.appendChild(d);
      });
    }catch(e){}
  }
  setTimeout(olaylariCek,550);
}

/* --------------- gorev paneli --------------- */
$("#gonder").onclick=async()=>{
  const b=$("#gonder"); b.disabled=true; $("#kNot").textContent="gönderiliyor...";
  try{
    const veri={baslik:$("#kBaslik").value, gorev:$("#kGorev").value,
      kriterler:$("#kKriter").value.split("\n"),
      calisma_dizini:$("#kDizin").value.trim(), dogrulama:$("#kDog").value,
      yazilabilir:$("#kYaz").value.split(",").map(s=>s.trim()).filter(Boolean),
      canli:$("#kCanli").checked, harita:$("#kHarita").checked};
    const r=await(await fetch("/api/gorev",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(veri)})).json();
    if(r.hata){$("#kNot").textContent="HATA: "+r.hata;}
    else{
      $("#kNot").textContent="";
      // form temizlenir: yeni gorev icin bos alan (dizin/yazilabilir tercihi kalir)
      $("#kBaslik").value=""; $("#kGorev").value=""; $("#kKriter").value="";
      const t=$("#tost");
      t.textContent="⚡ "+(r.baslik||r.is_id)+" başladı — usta bir sonraki aracında bildirilecek";
      t.style.display="block"; setTimeout(()=>t.style.display="none",6000);
      takip=true;
    }
  }catch(e){$("#kNot").textContent="HATA: "+e;}
  b.disabled=false;
};
$("#akis").addEventListener("wheel",()=>{const a=$("#akis");
  takip=a.scrollTop+a.clientHeight>=a.scrollHeight-60;});

boruCiz(); uygula(); filtreSec("tumu"); isleriCek(); olaylariCek(); daktiloAdim();
</script>
